---
# Preserve #2143's identity for the first attempt, including pre-label Jobs.
# Kubernetes also uses the Job name as a Pod label (63 characters maximum).
- name: Compute the migration identity for the target image
  ansible.builtin.set_fact:
    migration_image_hash: "{{ ([ansible_operator_meta.name, _image] | to_json | hash('sha256'))[:10] }}"
    migration_confirmed: false
    migration_existing_job: {}
    migration_successful_job: {}
    migration_pending: false

- name: Compute the original migration Job name
  ansible.builtin.set_fact:
    migration_job_name: "{{ ansible_operator_meta.name[:42] }}-migration-{{ migration_image_hash }}"

- name: Look up the original migration Job for this image
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ ansible_operator_meta.namespace }}"
    name: "{{ migration_job_name }}"
  register: original_migration_job

- name: Find migration attempts for this instance and image
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ ansible_operator_meta.namespace }}"
    label_selectors:
      - "app.kubernetes.io/part-of={{ ansible_operator_meta.name }}"
      - "awx.ansible.com/migration-image={{ migration_image_hash }}"
  register: migration_attempts

- name: Combine original and labeled migration attempts
  ansible.builtin.set_fact:
    migration_jobs: >-
      {{ (original_migration_job.resources + migration_attempts.resources)
         | unique(attribute='metadata.name') | sort(attribute='metadata.creationTimestamp') }}

# A failed Pod or temporarily inactive Job can still be retried by Kubernetes.
# Prefer an unfinished attempt to historical success; never reapply its template.
- name: Select an unfinished migration attempt
  ansible.builtin.set_fact:
    migration_existing_job: "{{ item }}"
  loop: "{{ migration_jobs }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when:
    - migration_existing_job | length == 0
    - (item.status.succeeded | default(0) | int) == 0
    - >-
      (item.status.active | default(0) | int) > 0 or
      (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Failed')
       | selectattr('status', 'equalto', 'True') | list | length) == 0

- name: Select the latest successful migration attempt
  ansible.builtin.set_fact:
    migration_successful_job: "{{ item }}"
  loop: "{{ migration_jobs }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: (item.status.succeeded | default(0) | int) == 1

# Success only describes the database at the time the Job ran. A subsequent
# pg_restore can roll it back without replacing any application Pods.
- name: Verify live database state before reusing a successful migration Job
  ansible.builtin.include_tasks: probe_migrations.yml
  when:
    - migration_existing_job | length == 0
    - migration_successful_job | length > 0

- name: Reuse successful migration history when no migrations are pending
  ansible.builtin.set_fact:
    migration_existing_job: "{{ migration_successful_job }}"
  when:
    - migration_existing_job | length == 0
    - migration_successful_job | length > 0
    - not migration_pending | bool

- name: Wait for the selected migration attempt
  ansible.builtin.set_fact:
    migration_job_name: "{{ migration_existing_job.metadata.name }}"
  when: migration_existing_job | length > 0

# New images retain the direct target-image migration path. Recovery attempts
# use generateName, leaving successful and terminally failed Jobs/logs intact.
- name: Create a migration attempt when none can be reused
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'jobs/migration.yaml.j2') }}"
  vars:
    migration_job_generate_name: "{{ migration_jobs | length > 0 }}"
  register: migrate_result
  when: migration_existing_job | length == 0

- name: Record the generated migration attempt name
  ansible.builtin.set_fact:
    migration_job_name: "{{ migrate_result.result.metadata.name }}"
  when: migration_existing_job | length == 0

- name: Watch for the migration job to finish
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ ansible_operator_meta.namespace }}"
    name: "{{ migration_job_name }}"
  register: migrate_watch_result
  until:
    - (migrate_watch_result.resources | default([]) | length) > 0
    - (migrate_watch_result.resources[0].status.succeeded | default(0) | int) == 1
  retries: 180
  delay: 5
  ignore_errors: true

# Consumed by update_status.yml; failures above also stop Django initialization.
- name: Record whether the migration for this image is confirmed successful
  ansible.builtin.set_fact:
    migration_confirmed: >-
      {{ migrate_watch_result is succeeded and
         (migrate_watch_result.resources | default([]) | length) > 0 and
         (migrate_watch_result.resources[0].status.succeeded | default(0) | int) == 1 }}

- name: Stop reconciliation when the migration is not confirmed successful
  ansible.builtin.fail:
    msg: >-
      Migration Job {{ migration_job_name }} was not confirmed successful.
      Refusing to continue Django initialization; inspect the Job and its
      Pod logs before retrying reconciliation.
  when: not migration_confirmed | bool
