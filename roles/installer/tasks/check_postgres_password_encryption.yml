---
# Check PostgreSQL password encryption method
# This task checks if an existing PostgreSQL pod is using MD5 or SCRAM-SHA-256 for password encryption

- name: Initialize password encryption facts
  set_fact:
    postgres_password_encryption_method: ""
    postgres_needs_password_migration: false
    postgres_users_to_migrate: []

- name: Check if postgres pod exists and is running
  block:
    - name: Get current password encryption method
      k8s_exec:
        namespace: "{{ ansible_operator_meta.namespace }}"
        pod: "{{ postgres_pod['resources'][0]['metadata']['name'] }}"
        command: |
          bash -c "
          export PGPASSWORD='{{ awx_postgres_pass }}'
          psql -U '{{ awx_postgres_user }}' -d '{{ awx_postgres_database }}' -t -c 'SHOW password_encryption;' | xargs
          "
      register: _postgres_password_encryption_result
      no_log: "{{ no_log }}"

    - name: Set password encryption method fact
      set_fact:
        postgres_password_encryption_method: "{{ _postgres_password_encryption_result.stdout | trim }}"

    - name: Check if migration is needed
      set_fact:
        postgres_needs_password_migration: true
      when: postgres_password_encryption_method == "md5"

    - name: Get list of users with MD5 passwords if migration needed
      k8s_exec:
        namespace: "{{ ansible_operator_meta.namespace }}"
        pod: "{{ postgres_pod['resources'][0]['metadata']['name'] }}"
        command: |
          bash -c "
          export PGPASSWORD='{{ awx_postgres_pass }}'
          psql -U '{{ awx_postgres_user }}' -d '{{ awx_postgres_database }}' -t -c \"
          SELECT rolname 
          FROM pg_authid 
          WHERE rolpassword IS NOT NULL 
          AND rolpassword LIKE 'md5%'
          AND rolname IN ('postgres', '{{ awx_postgres_user }}');
          \" | xargs
          "
      register: _postgres_md5_users_result
      no_log: "{{ no_log }}"
      when: postgres_needs_password_migration

    - name: Set users to migrate fact
      set_fact:
        postgres_users_to_migrate: "{{ _postgres_md5_users_result.stdout.split() | default([]) }}"
      when: postgres_needs_password_migration and _postgres_md5_users_result.stdout is defined

    - name: Display password encryption status
      debug:
        msg: |
          PostgreSQL Password Encryption Status:
          - Current method: {{ postgres_password_encryption_method }}
          - Migration needed: {{ postgres_needs_password_migration }}
          - Users to migrate: {{ postgres_users_to_migrate | join(', ') if postgres_users_to_migrate else 'None' }}
      when: not no_log

  when:
    - managed_database
    - postgres_pod['resources'] is defined
    - postgres_pod['resources'] | length > 0
    - postgres_pod['resources'][0]['status']['phase'] == 'Running'

- name: Set default values when postgres pod not available
  set_fact:
    postgres_password_encryption_method: "unknown"
    postgres_needs_password_migration: false
    postgres_users_to_migrate: []
  when: >
    not managed_database or
    postgres_pod['resources'] is not defined or
    postgres_pod['resources'] | length == 0 or
    postgres_pod['resources'][0]['status']['phase'] != 'Running'
